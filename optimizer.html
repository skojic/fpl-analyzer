<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Home screen icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#37003c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPL Analyzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Team & Chips - FPL Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <script src="ui.js"></script>
    <style>
        .op-rating { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
        .op-score { font-size: 3em; font-weight: 900; color: var(--primary-color); line-height: 1; }
        [data-theme="dark"] .op-score { color: var(--secondary-color); }
        .op-pos { font-weight: 800; margin: 8px 0 4px; color: var(--primary-color); }
        [data-theme="dark"] .op-pos { color: var(--secondary-color); }
        .op-player { display: flex; justify-content: space-between; padding: 2px 0; }
    </style>
</head>
<body class="page">
    <div class="container">
        <header>
            <button class="back-btn" onclick="window.close()" title="Close" aria-label="Close">←</button>
            <h1 data-i18n="cardOptimizer">AI Team & Chips</h1>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English" aria-label="English">🇬🇧</button>
                <button class="lang-btn" data-lang="sr" onclick="setLang('sr')" title="Srpski" aria-label="Srpski">🇷🇸</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="card">
            <div class="card-content" id="optimizer-content">
                <div class="ui-skeleton" aria-busy="true"><span class="sr-only" data-i18n="loadingText">Loading…</span><i></i><i></i><i></i></div>
            </div>
        </div>
    </div>

    <script src="fpl-api.js"></script>
    <script src="prediction.js"></script>
    <script>

        const CHIP_NAMES = () => ({ wildcard: t('chipWildcard'), freehit: t('chipFreeHit'), bboost: t('chipBenchBoost'), '3xc': t('chipTripleCaptain') });

        // A squad by position; players you don't own yet are marked as new
        function squadHtml(title, result, gwsLabel, ownedIds) {
            let html = `<div class="ui-panel"><h3 style="margin:0;">${title}</h3>
                <div class="ui-meta">£${safeNumber(result.cost, 1)}m · ${safeNumber(result.value, 1)} ${t('opPts')} ${gwsLabel} · <strong class="ui-up">+${safeNumber(result.gain, 1)}</strong> ${t('opVsYours')} · ${result.incoming.length} ${t('opChanges')}</div>`;
            for (const pos of ['GKP', 'DEF', 'MID', 'FWD']) {
                html += `<div class="op-pos">${pos}</div>`;
                for (const pr of result.squad.filter(x => x.player.position === pos).sort((a, b) => b.total - a.total)) {
                    const isNew = !ownedIds.has(pr.player.id);
                    html += `<div class="op-player"><span class="${isNew ? 'ui-up' : ''}">${isNew ? '+ ' : ''}${pr.player.name} <span style="opacity:0.6;">${pr.player.team}</span></span>
                        <span>£${safeNumber(pr.player.price, 1)}m · ${safeNumber(result.single ? pr.perGW[0] : pr.total, 1)}</span></div>`;
                }
            }
            if (result.outgoing.length) {
                html += `<div class="ui-meta" style="margin-top:10px;">${t('opOut')}: ${result.outgoing.map(p => p.name).join(', ')}</div>`;
            }
            return html + `</div>`;
        }

        async function loadOptimizer() {
            const content = document.getElementById('optimizer-content');
            content.innerHTML = `${UI.skeleton()}`;

            try {
                const [teamData, allPlayers] = await Promise.all([FPL_API.getTeamComposition(), FPL_API.getAllPlayers()]);
                const bank = teamData.entryHistory ? teamData.entryHistory.bank / 10 : 0;
                const [report, calendar] = await Promise.all([
                    Predictor.getSquadReport(teamData.picks, allPlayers, bank),
                    Predictor.getChipCalendar(teamData.picks, allPlayers, bank)
                ]);
                if (!report) {
                    content.innerHTML = `${UI.state('empty', t('fxNone'))}`;
                    return;
                }
                const ownedIds = new Set(teamData.picks.map(p => p.id));
                const range = `GW${report.horizon[0].id}–${report.horizon[report.horizon.length - 1].id}`;

                let html = `<div class="op-rating">
                        <div class="op-score">${report.rating}<span style="font-size:0.4em;">/100</span></div>
                        <div><h3 style="margin:0;">${t('opRating')}</h3>
                        <div class="ui-meta">${t('opRatingExplain').replace('{range}', range).replace('{budget}', safeNumber(report.budget, 1))}</div></div>
                    </div>`;

                html += `<div class="ui-grid-2">
                    ${report.wildcard ? squadHtml(`${t('chipWildcard')} · ${range}`, report.wildcard, range, ownedIds) : ''}
                    ${report.freeHit ? squadHtml(`${t('chipFreeHit')} · GW${report.freeHit.gameweek}`, { ...report.freeHit, single: true }, `GW${report.freeHit.gameweek}`, ownedIds) : ''}
                </div>`;

                if (calendar) {
                    const names = CHIP_NAMES();
                    html += `<h3 style="margin-top:28px;">${t('opCalendar')} · GW${calendar.weeks[0].gameweek}–${calendar.deadline}</h3>
                        <div style="margin:6px 0;">${['wildcard', 'freehit', 'bboost', '3xc'].map(c =>
                            `<span class="ui-pill${calendar.available.includes(c) ? '' : ' off'}" style="margin-right:6px;">${names[c]}</span>`).join('')}</div>
                        <div class="stats-info" style="font-size:0.84em; line-height:1.6;">${t('opCalendarExplain').replace('{deadline}', calendar.deadline)}</div>`;

                    const anySpecial = calendar.weeks.some(w => w.doubleTeams || w.blankTeams);
                    if (!anySpecial) html += `<div class="ui-meta">${t('opNoSpecial')}</div>`;

                    const cell = (w, chip, text) => `<td><span class="${calendar.best[chip] === w.gameweek ? 'ui-best' : ''}">${text}</span></td>`;
                    html += `<table class="data-table"><tr><th>GW</th><th>${t('opXI')}</th><th>${names.bboost}</th><th>${names['3xc']}</th><th>${names.freehit}</th><th>${t('opDoubles')}</th><th>${t('opBlanks')}</th></tr>`;
                    for (const w of calendar.weeks) {
                        html += `<tr><td>GW${w.gameweek}</td><td>${safeNumber(w.xiPoints, 1)}</td>
                            ${calendar.available.includes('bboost') ? cell(w, 'bboost', `+${safeNumber(w.bboost, 1)}`) : '<td>–</td>'}
                            ${calendar.available.includes('3xc') ? cell(w, '3xc', `+${safeNumber(w['3xc'], 1)} <span style="opacity:0.6;">${w.captain ? w.captain.name : ''}</span>`) : '<td>–</td>'}
                            ${w.freehit !== null ? cell(w, 'freehit', `+${safeNumber(w.freehit, 1)}`) : '<td>–</td>'}
                            <td>${w.doubleTeams ? `${w.doubleTeams} (${t('opYours')} ${w.squadDoubles})` : '–'}</td>
                            <td>${w.blankTeams ? `${w.blankTeams} (${t('opYours')} ${w.squadBlanks})` : '–'}</td></tr>`;
                    }
                    html += `</table>`;
                }

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `${UI.state('error', t('errorOptimizer'))}`;
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadOptimizer);
    </script>

    <footer class="site-footer" data-i18n-html="footerHtml">
        Made with <span class="heart">&#x2665;</span> for you by <a class="footer-author" href="https://github.com/skojic" target="_blank" rel="noopener">Srdjan Kojic</a> · <a class="footer-guide" href="guide.html">How it works</a>
    </footer>
</body>
</html>
