<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Home screen icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#37003c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPL Analyzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Team & Chips - FPL Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <style>
        .container {
            max-width: 1000px;
        }
        .card {
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.98) !important;
            border: 2px solid rgba(66, 181, 88, 0.3);
        }
        [data-theme="dark"] .card {
            background: var(--bg-surface, #1a1030) !important;
            border-color: var(--card-border, rgba(255,255,255,0.1));
        }
        .card-content {
            max-height: none;
        }
        .op-rating { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
        .op-score { font-size: 3em; font-weight: 900; color: var(--primary-color); line-height: 1; }
        [data-theme="dark"] .op-score { color: var(--secondary-color); }
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 768px) { .op-grid { grid-template-columns: 1fr; } }
        .op-squad { border: 1.5px solid rgba(55,0,60,0.15); border-radius: 12px; padding: 12px; font-size: 0.85em; }
        [data-theme="dark"] .op-squad { border-color: rgba(255,255,255,0.12); }
        .op-pos { font-weight: 800; margin: 8px 0 4px; color: var(--primary-color); }
        [data-theme="dark"] .op-pos { color: var(--secondary-color); }
        .op-player { display: flex; justify-content: space-between; padding: 2px 0; }
        .op-new { color: #16a34a; font-weight: 800; }
        .op-meta { font-size: 0.85em; color: var(--text-muted, #666); margin: 6px 0; }
        /* Plain table: the global table styles are built for the wide, sticky player database */
        .op-table { width: 100%; min-width: 0; border-collapse: collapse; font-size: 0.85em; margin: 10px 0 18px; }
        .op-table th, .op-table td { position: static; white-space: nowrap; box-shadow: none; cursor: default; font-size: 1em; text-align: right; padding: 6px 8px; }
        .op-table th:first-child, .op-table td:first-child { text-align: left; }
        .op-table td:first-child { background: transparent; color: inherit; }
        .op-table th { background: var(--primary-color); color: #fff; }
        .op-table td { border-bottom: 1px solid rgba(0,0,0,0.08); }
        .op-best { background: rgba(0,255,135,0.25); font-weight: 800; border-radius: 4px; }
        .op-chip { display: inline-block; padding: 2px 10px; border-radius: 12px; margin-right: 6px; font-weight: 700; font-size: 0.85em; background: var(--secondary-color); color: #37003c; }
        .op-chip.used { background: rgba(0,0,0,0.12); color: var(--text-muted, #666); text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="window.close()" title="Close" aria-label="Close">←</button>
            <h1 data-i18n="cardOptimizer">AI Team & Chips</h1>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English">🇬🇧</button>
                <button class="lang-btn" data-lang="sr" onclick="setLang('sr')" title="Srpski">🇷🇸</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="card">
            <div class="card-content" id="optimizer-content">
                <div class="loading">Optimizing...</div>
            </div>
        </div>
    </div>

    <script src="fpl-api.js"></script>
    <script src="prediction.js"></script>
    <script>
        function safeNumber(value, decimals = 0, defaultValue = 0) {
            const num = parseFloat(value);
            if (isNaN(num)) {
                return decimals > 0 ? defaultValue.toFixed(decimals) : defaultValue;
            }
            return decimals > 0 ? num.toFixed(decimals) : Math.round(num);
        }

        const CHIP_NAMES = () => ({ wildcard: t('chipWildcard'), freehit: t('chipFreeHit'), bboost: t('chipBenchBoost'), '3xc': t('chipTripleCaptain') });

        // A squad by position; players you don't own yet are marked as new
        function squadHtml(title, result, gwsLabel, ownedIds) {
            let html = `<div class="op-squad"><h3 style="margin:0;">${title}</h3>
                <div class="op-meta">£${safeNumber(result.cost, 1)}m · ${safeNumber(result.value, 1)} ${t('opPts')} ${gwsLabel} · <strong class="op-new">+${safeNumber(result.gain, 1)}</strong> ${t('opVsYours')} · ${result.incoming.length} ${t('opChanges')}</div>`;
            for (const pos of ['GKP', 'DEF', 'MID', 'FWD']) {
                html += `<div class="op-pos">${pos}</div>`;
                for (const pr of result.squad.filter(x => x.player.position === pos).sort((a, b) => b.total - a.total)) {
                    const isNew = !ownedIds.has(pr.player.id);
                    html += `<div class="op-player"><span class="${isNew ? 'op-new' : ''}">${isNew ? '+ ' : ''}${pr.player.name} <span style="opacity:0.6;">${pr.player.team}</span></span>
                        <span>£${safeNumber(pr.player.price, 1)}m · ${safeNumber(result.single ? pr.perGW[0] : pr.total, 1)}</span></div>`;
                }
            }
            if (result.outgoing.length) {
                html += `<div class="op-meta" style="margin-top:10px;">${t('opOut')}: ${result.outgoing.map(p => p.name).join(', ')}</div>`;
            }
            return html + `</div>`;
        }

        async function loadOptimizer() {
            const content = document.getElementById('optimizer-content');
            content.innerHTML = `<div class="loading">${t('opLoading')}</div>`;

            try {
                const [teamData, allPlayers] = await Promise.all([FPL_API.getTeamComposition(), FPL_API.getAllPlayers()]);
                const bank = teamData.entryHistory ? teamData.entryHistory.bank / 10 : 0;
                const [report, calendar] = await Promise.all([
                    Predictor.getSquadReport(teamData.picks, allPlayers, bank),
                    Predictor.getChipCalendar(teamData.picks, allPlayers, bank)
                ]);
                if (!report) {
                    content.innerHTML = `<div class="loading">${t('fxNone')}</div>`;
                    return;
                }
                const ownedIds = new Set(teamData.picks.map(p => p.id));
                const range = `GW${report.horizon[0].id}–${report.horizon[report.horizon.length - 1].id}`;

                let html = `<div class="op-rating">
                        <div class="op-score">${report.rating}<span style="font-size:0.4em;">/100</span></div>
                        <div><h3 style="margin:0;">${t('opRating')}</h3>
                        <div class="op-meta">${t('opRatingExplain').replace('{range}', range).replace('{budget}', safeNumber(report.budget, 1))}</div></div>
                    </div>`;

                html += `<div class="op-grid">
                    ${report.wildcard ? squadHtml(`${t('chipWildcard')} · ${range}`, report.wildcard, range, ownedIds) : ''}
                    ${report.freeHit ? squadHtml(`${t('chipFreeHit')} · GW${report.freeHit.gameweek}`, { ...report.freeHit, single: true }, `GW${report.freeHit.gameweek}`, ownedIds) : ''}
                </div>`;

                if (calendar) {
                    const names = CHIP_NAMES();
                    html += `<h3 style="margin-top:28px;">${t('opCalendar')} · GW${calendar.weeks[0].gameweek}–${calendar.deadline}</h3>
                        <div style="margin:6px 0;">${['wildcard', 'freehit', 'bboost', '3xc'].map(c =>
                            `<span class="op-chip${calendar.available.includes(c) ? '' : ' used'}">${names[c]}</span>`).join('')}</div>
                        <div class="stats-info" style="font-size:0.84em; line-height:1.6;">${t('opCalendarExplain').replace('{deadline}', calendar.deadline)}</div>`;

                    const anySpecial = calendar.weeks.some(w => w.doubleTeams || w.blankTeams);
                    if (!anySpecial) html += `<div class="op-meta">${t('opNoSpecial')}</div>`;

                    const cell = (w, chip, text) => `<td><span class="${calendar.best[chip] === w.gameweek ? 'op-best' : ''}">${text}</span></td>`;
                    html += `<table class="op-table"><tr><th>GW</th><th>${t('opXI')}</th><th>${names.bboost}</th><th>${names['3xc']}</th><th>${names.freehit}</th><th>${t('opDoubles')}</th><th>${t('opBlanks')}</th></tr>`;
                    for (const w of calendar.weeks) {
                        html += `<tr><td>GW${w.gameweek}</td><td>${safeNumber(w.xiPoints, 1)}</td>
                            ${calendar.available.includes('bboost') ? cell(w, 'bboost', `+${safeNumber(w.bboost, 1)}`) : '<td>–</td>'}
                            ${calendar.available.includes('3xc') ? cell(w, '3xc', `+${safeNumber(w['3xc'], 1)} <span style="opacity:0.6;">${w.captain ? w.captain.name : ''}</span>`) : '<td>–</td>'}
                            ${w.freehit !== null ? cell(w, 'freehit', `+${safeNumber(w.freehit, 1)}`) : '<td>–</td>'}
                            <td>${w.doubleTeams ? `${w.doubleTeams} (${t('opYours')} ${w.squadDoubles})` : '–'}</td>
                            <td>${w.blankTeams ? `${w.blankTeams} (${t('opYours')} ${w.squadBlanks})` : '–'}</td></tr>`;
                    }
                    html += `</table>`;
                }

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="loading">${t('errorOptimizer')}</div>`;
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadOptimizer);
    </script>

    <footer class="site-footer" data-i18n-html="footerHtml">
        Made with <span class="heart">&#x2665;</span> for you by <strong>Srdjan Kojic</strong>
    </footer>
</body>
</html>
