<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Home screen icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#37003c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPL Analyzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Transfer Suggestions - FPL Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <script src="ui.js"></script>
    <style>
        /* Transfer position group */
        .tr-group {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(248,250,252,0.88) 100%);
            border-radius: 16px;
        }
        [data-theme="dark"] .tr-group {
            background: rgba(255,255,255,0.04);
        }
        /* Transfer item dark override — fights inline background:white */
        [data-theme="dark"] .transfer-item {
            background: rgba(255,255,255,0.06) !important;
        }
        /* Reason divider */
        .transfer-reason {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.12);
        }
        [data-theme="dark"] .transfer-reason {
            border-top-color: rgba(255,255,255,0.10);
        }
        /* Multi-week transfer plan */
        .plan-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .plan-gain { background: var(--secondary-color); color: var(--on-accent); padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 0.9em; }
        .plan-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
        .plan-step { border: 1.5px solid var(--border-strong); border-radius: 10px; padding: 10px; font-size: 0.85em; }
                .plan-step.roll { opacity: 0.75; }
        .plan-step-gw { font-weight: 800; color: var(--primary-color); display: flex; justify-content: space-between; }
        .plan-hit { color: var(--negative); font-weight: 800; }
        .plan-move { margin: 6px 0; line-height: 1.4; }
        .plan-meta { margin-top: 6px; font-size: 0.85em; color: var(--text-muted, #666); }
        .plan-ban { border: none; background: none; cursor: pointer; font-size: 0.85em; padding: 0 2px; opacity: 0.6; }
        .plan-ban:hover { opacity: 1; }
        .mt-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; }
        .mt-form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85em; font-weight: 700; }
        .mt-form select { padding: 6px 8px; border-radius: 8px; min-width: 220px; max-width: 100%; }
    </style>
</head>
<body class="page">
    <div class="container">
        <header>
            <button class="back-btn" onclick="window.close()" title="Close" aria-label="Close">←</button>
            <h1 data-i18n="cardTransfers">Transfer Suggestions</h1>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English" aria-label="English">🇬🇧</button>
                <button class="lang-btn" data-lang="sr" onclick="setLang('sr')" title="Srpski" aria-label="Srpski">🇷🇸</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="card">
            <div class="card-content" id="transfers-content">
                <div class="ui-skeleton" aria-busy="true"><span class="sr-only" data-i18n="loadingText">Loading…</span><i></i><i></i><i></i></div>
            </div>
        </div>
    </div>

    <script src="fpl-api.js"></script>
    <script src="prediction.js"></script>
    <script>

        // ── Multi-week plan with lock / ban, saved per team ──
        let planInputs = null;

        function togglePlanPref(list, id) {
            const prefs = FPL_API.getPlanPrefs();
            prefs[list] = prefs[list].includes(id) ? prefs[list].filter(x => x !== id) : [...prefs[list], id];
            FPL_API.savePlanPrefs(prefs);
            renderPlan();
        }

        async function renderPlan() {
            const el = document.getElementById('plan-section');
            if (!el || !planInputs) return;
            el.innerHTML = `${UI.skeleton()}`;
            try {
                const prefs = FPL_API.getPlanPrefs();
                const plan = await Predictor.planTransfers(planInputs.picks, planInputs.allPlayers, planInputs.bank, prefs);
                if (!plan.horizon.length) { el.innerHTML = ''; return; }
                const range = `GW${plan.horizon[0].id}–${plan.horizon[plan.horizon.length - 1].id}`;
                const byId = new Map(planInputs.allPlayers.map(p => [p.id, p]));

                let html = `<div class="plan-header">
                        <h3 style="margin:0;">${t('planTitle')} · ${range}</h3>
                        <span class="plan-gain">+${safeNumber(plan.gain, 1)} pts ${t('planVsRoll')}</span>
                    </div>
                    <div class="plan-steps">`;
                for (const step of plan.steps) {
                    html += `<div class="plan-step${step.moves.length ? '' : ' roll'}">
                        <div class="plan-step-gw"><span>GW${step.gw}</span><span>${step.freeTransfers} ${UI.term('ft', t('planFT'))}${step.hit ? ` <span class="plan-hit">${UI.term('hit', `−${step.hit}`)}</span>` : ''}</span></div>
                        ${step.moves.length
                            ? step.moves.map(m => `<div class="plan-move">${m.out.name} → <strong>${m.in.name}</strong> £${safeNumber(m.in.price, 1)}m
                                <button class="plan-ban" title="${t('planBan')}" onclick="togglePlanPref('banned', ${m.in.id})">⛔</button></div>`).join('')
                            : `<div class="plan-move">${t('planRoll')}</div>`}
                        <div class="plan-meta">${t('planXI')} ${safeNumber(step.points, 1)} · ${t('planCaptain')} ${step.captain ? step.captain.name : '–'}</div>
                    </div>`;
                }
                html += `</div>`;

                html += `<div style="font-size:0.85em;">${t('planLockHint')}</div><div class="ui-chips">`;
                for (const p of plan.squad) {
                    const on = prefs.locked.includes(p.id);
                    html += `<button class="ui-chip${on ? ' on' : ''}" onclick="togglePlanPref('locked', ${p.id})">${on ? '🔒 ' : ''}${p.name}</button>`;
                }
                html += `</div>`;
                if (prefs.banned.length) {
                    html += `<div style="font-size:0.85em;">${t('planBanned')}</div><div class="ui-chips">`;
                    for (const id of prefs.banned) {
                        const p = byId.get(id);
                        html += `<button class="ui-chip on" onclick="togglePlanPref('banned', ${id})">⛔ ${p ? p.name : id} ✕</button>`;
                    }
                    html += `</div>`;
                }
                el.innerHTML = html;
            } catch (error) {
                el.innerHTML = `${UI.state('error', t('errorTransfers'))}`;
                console.error(error);
            }
        }

        // ── Transfers you've made in FPL that FPL doesn't publish until the deadline ──
        let manualState = null;

        function manualSection(plan, allPlayers) {
            const next = plan.horizon[0];
            if (!next) return '';
            manualState = { plan, allPlayers, event: next.id };
            const list = plan.manual.length
                ? plan.manual.map((m, i) => UI.row({
                    title: `${UI.esc(m.out.name)} → <strong>${UI.esc(m.in.name)}</strong>`,
                    meta: `${m.in.team} • £${safeNumber(m.in.price, 1)}m`,
                    value: `<button class="ui-chip" type="button" onclick="removeManual(${i})">${t('mtRemove')}</button>`
                })).join('')
                : `<div class="ui-meta">${t('mtNone')}</div>`;
            const squadOptions = plan.squad.slice().sort((a, b) => 'GKPDEFMIDFWD'.indexOf(a.position) - 'GKPDEFMIDFWD'.indexOf(b.position) || a.name.localeCompare(b.name))
                .map(p => `<option value="${p.id}">${UI.esc(p.name)} (${p.position}, ${p.team})</option>`).join('');
            return `<div class="tr-group mt-box" style="border-left: 6px solid var(--warning);">
                <h3 style="margin:0;">${t('mtTitle')} · GW${next.id}</h3>
                <div class="ui-meta">${t('mtExplain')}</div>
                ${list}
                <div class="mt-form">
                    <label>${t('transferOut')} <select id="mt-out" onchange="fillManualIn()"><option value="">–</option>${squadOptions}</select></label>
                    <label>${t('transferIn')} <select id="mt-in" disabled><option value="">–</option></select></label>
                    <button class="ui-chip on" type="button" onclick="addManual()">${t('mtAdd')}</button>
                </div>
                <div id="mt-error" class="ui-meta ui-down" role="alert"></div>
            </div>`;
        }

        // Players you could bring in for the selected one: same position, not in your squad, by price
        function fillManualIn() {
            const outId = parseInt(document.getElementById('mt-out').value, 10);
            const select = document.getElementById('mt-in');
            const out = manualState.plan.squad.find(p => p.id === outId);
            if (!out) { select.innerHTML = '<option value="">–</option>'; select.disabled = true; return; }
            const owned = new Set(manualState.plan.squad.map(p => p.id));
            select.innerHTML = '<option value="">–</option>' + manualState.allPlayers
                .filter(p => p.position === out.position && !owned.has(p.id) && p.status !== 'u')
                .sort((a, b) => b.price - a.price || a.name.localeCompare(b.name))
                .map(p => `<option value="${p.id}">${UI.esc(p.name)} (${p.team}) £${safeNumber(p.price, 1)}m</option>`).join('');
            select.disabled = false;
        }

        function addManual() {
            const error = document.getElementById('mt-error');
            const outId = parseInt(document.getElementById('mt-out').value, 10);
            const inId = parseInt(document.getElementById('mt-in').value, 10);
            const { plan, allPlayers, event } = manualState;
            const out = plan.squad.find(p => p.id === outId);
            const incoming = allPlayers.find(p => p.id === inId);
            if (!out || !incoming) { error.textContent = t('mtPick'); return; }
            // Budget and the 3-per-club limit after this transfer
            if (incoming.price > plan.bank + plan.sellingPrice[out.id] + 1e-9) {
                error.textContent = t('mtBudget').replace('{need}', safeNumber(incoming.price - plan.sellingPrice[out.id] - plan.bank, 1));
                return;
            }
            const clubs = plan.squad.filter(p => p.id !== out.id && p.teamId === incoming.teamId).length;
            if (clubs >= 3) { error.textContent = t('mtClub').replace('{team}', incoming.team); return; }
            const data = FPL_API.getManualTransfers();
            const transfers = data.event === event ? data.transfers : [];
            FPL_API.saveManualTransfers({ event, transfers: [...transfers, { out: out.id, in: incoming.id }] });
            loadTransfers();
        }

        function removeManual(index) {
            const data = FPL_API.getManualTransfers();
            data.transfers.splice(index, 1);
            FPL_API.saveManualTransfers(data);
            loadTransfers();
        }

        async function loadTransfers() {
            const content = document.getElementById('transfers-content');

            try {
                const teamData = await FPL_API.getTeamComposition();
                const allPlayers = await FPL_API.getAllPlayers();
                const bank = teamData.entryHistory ? teamData.entryHistory.bank / 10 : 0;

                content.innerHTML = `${UI.skeleton()}`;

                const plan = await Predictor.getTransferPlan(teamData.picks, allPlayers, bank);
                planInputs = { picks: teamData.picks, allPlayers, bank };
                const transfers = plan.transfers;
                const budget = plan.bank;
                const horizon = plan.horizon.length ? `GW${plan.horizon[0].id}–${plan.horizon[plan.horizon.length - 1].id}` : '';
                const verdictLabels = { make: t('verdictMake'), hit: t('verdictHit'), marginal: t('verdictMarginal') };

                // Group transfers by position
                const gkpTransfers = transfers.filter(tr => tr.position === 'GKP');
                const defTransfers = transfers.filter(tr => tr.position === 'DEF');
                const midTransfers = transfers.filter(tr => tr.position === 'MID');
                const fwdTransfers = transfers.filter(tr => tr.position === 'FWD');

                let html = `
                    <h3>${t('transferAnalysis')}</h3>

                    <div class="stats-info" style="margin-bottom:18px; font-size:0.84em; line-height:1.6;">
                        ${t('howCalcBlock')}
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-card-value">£${safeNumber(budget, 1)}m</div>
                            <div class="stat-card-label">${t('budgetAvail')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value">${plan.freeTransfers}</div>
                            <div class="stat-card-label">${t('freeTransfers')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value">${gkpTransfers.length}</div>
                            <div class="stat-card-label">${t('gkpOptions')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value">${defTransfers.length + midTransfers.length + fwdTransfers.length}</div>
                            <div class="stat-card-label">${t('outfieldOptions')}</div>
                        </div>
                    </div>

                    ${manualSection(plan, allPlayers)}

                    <div id="plan-section" class="tr-group" style="border-left: 6px solid var(--secondary-color);"></div>

                    <h3 style="margin-top: 30px;">${t('singleTransfers')}</h3>
                `;

                if (transfers.length === 0) {
                    html += `
                        <div style="text-align: center; padding: 40px; margin-top: 20px; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-radius: 12px; border: 2px solid var(--secondary-color);">
                            <h3 style="color: var(--primary-color); font-size: 1.8em;">${t('perfectTeam')}</h3>
                            <p style="font-size: 1.1em; margin-top: 10px;">${t('perfectTeamDesc')}</p>
                        </div>
                    `;
                } else {
                    // Render transfers by position group — GKP first, then outfield
                    const positionGroups = [
                        { name: t('gkpFull'), transfers: gkpTransfers, color: '#f59e0b', emoji: '🧤', isGKP: true },
                        { name: t('defFull'),   transfers: defTransfers, color: '#3b82f6', emoji: '🛡️', isGKP: false },
                        { name: t('midFull'), transfers: midTransfers, color: '#8b5cf6', emoji: '⚡',  isGKP: false },
                        { name: t('fwdFull'),    transfers: fwdTransfers, color: '#ef4444', emoji: '⚽',  isGKP: false }
                    ];

                    for (const group of positionGroups) {
                        if (group.transfers.length === 0) continue;

                        html += `
                            <div class="tr-group" style="border-left: 6px solid ${group.color};">
                                <h3 style="color: ${group.color}; margin-bottom: 20px; font-size: 1.6em; display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 1.4em;">${group.emoji}</span>
                                    ${group.name}${t('transferSuggSuffix')}
                                </h3>
                        `;

                        for (let i = 0; i < group.transfers.length; i++) {
                            const transfer = group.transfers[i];

                            // Fixtures over the horizon with projected points
                            const outFixtures = transfer.outProjection.fixtures;
                            const inFixtures = transfer.inProjection.fixtures;

                            html += `
                                <div class="transfer-item" style="margin-bottom: 20px; border: 2px solid ${group.color}20; border-radius: 12px;">
                                    <div class="transfer-header" style="background: linear-gradient(135deg, ${group.color}15 0%, ${group.color}05 100%); border-bottom: 2px solid ${group.color}30;">
                                        <strong style="color: ${group.color}; font-size: 1.1em;">${t('option')} ${i + 1}</strong>
                                        <span style="margin-left: auto; margin-right: 10px; font-size: 0.9em; color: var(--text-muted, #666);">${verdictLabels[transfer.verdict] || ''}</span>
                                        <span class="expected-points" style="background: ${transfer.verdict === 'marginal' ? '#9ca3af' : group.color}; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold;">+${safeNumber(transfer.expectedPointsGain, 1)} pts (${horizon})</span>
                                    </div>

                                <div class="transfer-players">
                                    <div class="transfer-out" style="flex: 1;">
                                        <div><strong style="color: #ff2882;">OUT:</strong> ${transfer.out.name}</div>
                                        <div style="font-size: 0.9em; color: var(--text-muted, #666); margin-top: 5px;">
                                            ${transfer.out.team} • ${transfer.out.position} • £${safeNumber(transfer.out.price, 1)}m (${t('sellPrice')} £${safeNumber(transfer.out.sellingPrice, 1)}m)
                                        </div>
                                        <div style="font-size: 0.85em; margin-top: 5px;">
                                            ${group.isGKP
                                                ? `CS: ${safeNumber(transfer.out.cleanSheets, 0)} | Saves/G: ${safeNumber(parseFloat(transfer.out.saves || 0) / Math.max(1, parseFloat(transfer.out.starts || 1)), 1)} | Mins: ${safeNumber(transfer.out.minutes, 0)}`
                                                : `Form: ${safeNumber(transfer.out.form, 1)} | Points: ${safeNumber(transfer.out.points, 0)}`
                                            }
                                        </div>
                                    </div>
                                    <div class="transfer-arrow" style="font-size: 2em;">→</div>
                                    <div class="transfer-in" style="flex: 1;">
                                        <div><strong style="color: #00ff87;">IN:</strong> ${transfer.in.name}</div>
                                        <div style="font-size: 0.9em; color: var(--text-muted, #666); margin-top: 5px;">
                                            ${transfer.in.team} • ${transfer.in.position} • £${safeNumber(transfer.in.price, 1)}m
                                        </div>
                                        <div style="font-size: 0.85em; margin-top: 5px;">
                                            ${group.isGKP
                                                ? `CS: ${safeNumber(transfer.in.cleanSheets, 0)} | Saves/G: ${safeNumber(parseFloat(transfer.in.saves || 0) / Math.max(1, parseFloat(transfer.in.starts || 1)), 1)} | Mins: ${safeNumber(transfer.in.minutes, 0)}`
                                                : `Form: ${safeNumber(transfer.in.form, 1)} | Points: ${safeNumber(transfer.in.points, 0)}`
                                            }
                                        </div>
                                    </div>
                                </div>

                                <div class="transfer-reason">
                                    <strong>${t('transferReason')}:</strong> ${transfer.reason}
                                </div>

                                <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 0.9em;">
                                    <span><strong>${t('transferCost')}:</strong> ${transfer.cost >= 0 ? '+' : ''}£${safeNumber(transfer.cost, 1)}m</span>
                                    <span><strong>${t('newBudget')}:</strong> £${safeNumber(budget - transfer.cost, 1)}m</span>
                                </div>

                                <div style="margin-top: 15px;">
                                    <h5 style="margin-bottom: 8px;">${t('fixturesXPts')}</h5>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                        <div>
                                            <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #ff2882;">
                                                ${transfer.out.name}
                                            </div>
                        `;

                        for (const f of outFixtures) {
                            html += `
                                <div style="font-size: 0.8em; padding: 3px 0;">
                                    GW${f.event} ${f.isHome ? 'vs' : '@'} ${f.opponent}
                                    <span class="fixture-difficulty difficulty-${f.difficulty}" style="padding: 2px 6px; font-size: 0.9em;">
                                        ${f.difficulty}
                                    </span>
                                    <strong>${safeNumber(f.expectedPoints, 1)}</strong>
                                </div>
                            `;
                        }

                        html += `
                                        </div>
                                        <div>
                                            <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #00ff87;">
                                                ${transfer.in.name}
                                            </div>
                        `;

                        for (const f of inFixtures) {
                            html += `
                                <div style="font-size: 0.8em; padding: 3px 0;">
                                    GW${f.event} ${f.isHome ? 'vs' : '@'} ${f.opponent}
                                    <span class="fixture-difficulty difficulty-${f.difficulty}" style="padding: 2px 6px; font-size: 0.9em;">
                                        ${f.difficulty}
                                    </span>
                                    <strong>${safeNumber(f.expectedPoints, 1)}</strong>
                                </div>
                            `;
                        }

                        html += `
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        }

                        html += `</div>`; // Close position group
                    }
                }

                // Show players to watch
                html += `<h3 style="margin-top: 30px; color: var(--primary-color);">${t('playersToWatch')}</h3>`;
                html += `<p style="margin-bottom: 15px; color: var(--text-muted, #666);">${t('highPerformers')}</p>`;

                // Find top performers by position
                const positions = ['GKP', 'DEF', 'MID', 'FWD'];
                const posFullNames = { GKP: t('gkpFull'), DEF: t('defFull'), MID: t('midFull'), FWD: t('fwdFull') };
                for (const pos of positions) {
                    const topInPosition = allPlayers
                        .filter(p => p.position === pos && p.status === 'a' && p.minutes > 100)
                        .sort((a, b) => b.form - a.form)
                        .slice(0, 3);

                    html += `<h4 style="margin: 15px 0 10px 0;">${posFullNames[pos]}</h4>`;

                    for (const player of topInPosition) {
                        const valueScore = Predictor.getValueScore(player);
                        html += `
                            <div class="player-row">
                                <div class="player-info">
                                    <div class="player-name">${player.name}</div>
                                    <div class="player-meta">${player.team} • £${safeNumber(player.price, 1)}m • ${safeNumber(player.selectedBy, 1)}% TSB</div>
                                </div>
                                <div class="player-stats">
                                    <div class="stat">
                                        <div class="stat-value">${safeNumber(player.form, 1)}</div>
                                        <div class="stat-label">${t('form')}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value">${safeNumber(player.points, 0)}</div>
                                        <div class="stat-label">${t('colPoints')}</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value">${safeNumber(valueScore, 1)}</div>
                                        <div class="stat-label">${t('valueLabel')}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                content.innerHTML = html;
                renderPlan();
            } catch (error) {
                content.innerHTML = `${UI.state('error', t('errorTransfers'))}`;
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadTransfers);
    </script>

    <footer class="site-footer" data-i18n-html="footerHtml">
        Made with <span class="heart">&#x2665;</span> for you by <a class="footer-author" href="https://github.com/skojic" target="_blank" rel="noopener">Srdjan Kojic</a>
    </footer>
</body>
</html>
