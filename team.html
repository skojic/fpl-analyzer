<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Home screen icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#37003c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPL Analyzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Team - FPL Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <script src="ui.js"></script>
    <style>
    </style>
</head>
<body class="page">
    <div class="container">
        <header>
            <h1 id="team-name-header" data-i18n="cardMyTeam">My Team</h1>
            <p class="team-subtitle" id="team-subtitle">Loading...</p>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English" aria-label="English">🇬🇧</button>
                <button class="lang-btn" data-lang="sr" onclick="setLang('sr')" title="Srpski" aria-label="Srpski">🇷🇸</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="card">
            <div class="card-content" id="team-content">
                <div class="ui-skeleton" aria-busy="true"><span class="sr-only" data-i18n="loadingText">Loading…</span><i></i><i></i><i></i></div>
            </div>
        </div>
    </div>

    <script src="fpl-api.js"></script>
    <script src="prediction.js"></script>
    <script>
        let _fixtureMap = {};



        async function loadTeam() {
            const content = document.getElementById('team-content');

            try {
                const [managerData, teamData, fixtures, bootstrap] = await Promise.all([
                    FPL_API.getManagerTeam(),
                    FPL_API.getTeamComposition(),
                    FPL_API.getFixtures(),
                    FPL_API.getBootstrapStatic()
                ]);

                // Next fixture per team for the pitch
                _fixtureMap = UI.nextFixtureMap(bootstrap, fixtures);

                // Update header
                document.title = `${managerData.name} - My Team`;
                document.getElementById('team-name-header').textContent = managerData.name;
                document.getElementById('team-subtitle').textContent = `Team ID: ${FPL_API.TEAM_ID}`;

                // Pitch: starting XI (squad positions 1-11) and bench in order
                teamData.picks.sort((a, b) => a.squadPosition - b.squadPosition);
                let html = UI.pitch(teamData.picks.filter(p => p.squadPosition <= 11), teamData.picks.filter(p => p.squadPosition > 11), _fixtureMap);

                if (teamData.entryHistory) {
                    html += UI.stats([
                        [teamData.entryHistory.points, t('gwPoints')],
                        [`£${safeNumber(teamData.entryHistory.bank / 10, 1)}m`, t('bank')],
                        [`£${safeNumber(teamData.entryHistory.value / 10, 1)}m`, t('teamValue')],
                        [teamData.entryHistory.event_transfers, t('transfersGW')]
                    ]);
                }

                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = UI.state('error', t('errorTeam'));
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadTeam);
    </script>
    <footer class="site-footer" data-i18n-html="footerHtml">
        Made with <span class="heart">♥</span> for you by <strong>Srdjan Kojic</strong>
        <span class="footer-sep">|</span>
        FPL Analyzer &bull; 2025/26
    </footer>
</body>
</html>
