<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Home screen icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#37003c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FPL Analyzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Price Changes - FPL Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <style>
        .container {
            max-width: 1000px;
        }
        .card {
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.98) !important;
            border: 2px solid rgba(66, 181, 88, 0.3);
        }
        [data-theme="dark"] .card {
            background: var(--bg-surface, #1a1030) !important;
            border-color: var(--card-border, rgba(255,255,255,0.1));
        }
        .card-content {
            max-height: none;
        }
        .pc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
        @media (max-width: 768px) { .pc-grid { grid-template-columns: 1fr; } }
        /* Plain table: the global table styles are built for the wide, sticky player database */
        .pc-table { width: 100%; min-width: 0; border-collapse: collapse; font-size: 0.85em; margin: 8px 0 20px; }
        .pc-table th, .pc-table td { position: static; white-space: nowrap; box-shadow: none; cursor: default; font-size: 1em; text-align: right; padding: 5px 8px; }
        .pc-table th:first-child, .pc-table td:first-child { text-align: left; }
        .pc-table td:first-child { background: transparent; color: inherit; }
        .pc-table th { background: var(--primary-color); color: #fff; }
        .pc-table td { border-bottom: 1px solid rgba(0,0,0,0.08); }
        .pc-up { color: #16a34a; font-weight: 800; }
        .pc-down { color: #e0004d; font-weight: 800; }
        .pc-bar { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.1); vertical-align: middle; margin-right: 6px; position: relative; overflow: hidden; }
        .pc-bar span { position: absolute; top: 0; bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="window.close()" title="Close" aria-label="Close">←</button>
            <h1 data-i18n="cardPrices">Price Changes</h1>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English">🇬🇧</button>
                <button class="lang-btn" data-lang="sr" onclick="setLang('sr')" title="Srpski">🇷🇸</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="card">
            <div class="card-content" id="prices-content">
                <div class="loading">Loading prices...</div>
            </div>
        </div>
    </div>

    <script src="fpl-api.js"></script>
    <script src="prediction.js"></script>
    <script>
        function safeNumber(value, decimals = 0, defaultValue = 0) {
            const num = parseFloat(value);
            if (isNaN(num)) {
                return decimals > 0 ? defaultValue.toFixed(decimals) : defaultValue;
            }
            return decimals > 0 ? num.toFixed(decimals) : Math.round(num);
        }

        // Progress towards the next change: -100% (fall) .. +100% (rise)
        function progress(percent) {
            const p = Math.max(-100, Math.min(100, percent));
            const style = p >= 0 ? `left:50%; width:${p / 2}%; background:#16a34a;` : `right:50%; width:${-p / 2}%; background:#e0004d;`;
            return `<span class="pc-bar"><span style="${style}"></span></span><span class="${p >= 0 ? 'pc-up' : 'pc-down'}">${p > 0 ? '+' : ''}${safeNumber(percent, 0)}%</span>`;
        }
        const tonight = p => (p.priceChangeProjections[0] ? p.priceChangeProjections[0].percent : p.priceChangePercent);
        const change = tenths => (tenths ? `<span class="${tenths > 0 ? 'pc-up' : 'pc-down'}">${tenths > 0 ? '+' : '−'}£${safeNumber(Math.abs(tenths) / 10, 1)}m</span>` : '–');

        // Full table for your squad; the side-by-side lists keep the essential columns
        function table(players, { sell = null, compact = false } = {}) {
            const cols = [
                [t('colName'), p => `<a href="player.html?id=${p.id}" target="_blank">${p.name}</a> <span style="opacity:0.6;">${p.team}</span>`],
                [t('colPrice'), p => `£${safeNumber(p.price, 1)}m`],
                sell && [t('sellPrice'), p => `£${safeNumber(sell[p.id], 1)}m`],
                !compact && [t('pcNow'), p => progress(p.priceChangePercent)],
                [t('pcTonight'), p => progress(tonight(p))],
                !compact && [t('pcThisGW'), p => change(p.costChangeEvent)],
                [t('pcNetTransfers'), p => (p.transfersInEvent - p.transfersOutEvent).toLocaleString()]
            ].filter(Boolean);
            return `<table class="pc-table"><tr>${cols.map(([h]) => `<th>${h}</th>`).join('')}</tr>
                ${players.map(p => `<tr>${cols.map(([, cell]) => `<td>${cell(p)}</td>`).join('')}</tr>`).join('')}
            </table>`;
        }

        async function loadPrices() {
            const content = document.getElementById('prices-content');
            try {
                const [teamData, allPlayers] = await Promise.all([FPL_API.getTeamComposition(), FPL_API.getAllPlayers()]);
                const bank = teamData.entryHistory ? teamData.entryHistory.bank / 10 : 0;
                const ctx = await Predictor.getContext();
                const state = await Predictor.getTransferState(teamData.picks, allPlayers, bank, ctx);
                const byId = new Map(allPlayers.map(p => [p.id, p]));
                const squad = state.squad.map(p => byId.get(p.id)).filter(Boolean).sort((a, b) => Math.abs(tonight(b)) - Math.abs(tonight(a)));

                const risers = allPlayers.filter(p => tonight(p) >= 50).sort((a, b) => tonight(b) - tonight(a)).slice(0, 15);
                const fallers = allPlayers.filter(p => tonight(p) <= -50 && p.selectedBy >= 0.5).sort((a, b) => tonight(a) - tonight(b)).slice(0, 15);
                const rose = allPlayers.filter(p => p.costChangeEvent > 0).sort((a, b) => b.costChangeEvent - a.costChangeEvent || b.selectedBy - a.selectedBy);
                const fell = allPlayers.filter(p => p.costChangeEvent < 0).sort((a, b) => a.costChangeEvent - b.costChangeEvent || b.selectedBy - a.selectedBy);
                const atRisk = squad.filter(p => Math.abs(tonight(p)) >= 100);

                let html = `<div class="stats-info" style="font-size:0.84em; line-height:1.6; margin-bottom:14px;">${t('pcExplain')}</div>`;
                html += `<h3>${t('pcYourSquad')}</h3>`;
                if (atRisk.length) {
                    html += `<div style="font-weight:700; margin:4px 0;">${t('pcSquadAlert')}: ${atRisk.map(p => `<span class="${tonight(p) > 0 ? 'pc-up' : 'pc-down'}">${p.name} ${tonight(p) > 0 ? '▲' : '▼'}</span>`).join(', ')}</div>`;
                }
                html += table(squad, { sell: state.sellingPrice });
                html += `<div class="pc-grid">
                    <div><h3>${t('pcRisers')}</h3>${risers.length ? table(risers, { compact: true }) : `<p>${t('pcNone')}</p>`}</div>
                    <div><h3>${t('pcFallers')}</h3>${fallers.length ? table(fallers, { compact: true }) : `<p>${t('pcNone')}</p>`}</div>
                </div>
                <div class="pc-grid">
                    <div><h3>${t('pcRose')}</h3>${rose.length ? table(rose.slice(0, 20), { compact: true }) : `<p>${t('pcNone')}</p>`}</div>
                    <div><h3>${t('pcFell')}</h3>${fell.length ? table(fell.slice(0, 20), { compact: true }) : `<p>${t('pcNone')}</p>`}</div>
                </div>`;
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="loading">${t('errorPrices')}</div>`;
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPrices);
    </script>

    <footer class="site-footer" data-i18n-html="footerHtml">
        Made with <span class="heart">&#x2665;</span> for you by <strong>Srdjan Kojic</strong>
    </footer>
</body>
</html>
