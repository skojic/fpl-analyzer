# Daily data refresh, free on public repositories.
# Rebuilds data/*.json (recent form, top-manager ownership, bookmaker odds, model accuracy)
# and commits them only when they change;
# the push redeploys the site on Vercel.
name: Data refresh

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Used only if the FPL API refuses direct requests from GitHub's servers
      FPL_PROXY: https://fpl-analyzer-eosin.vercel.app/api/proxy?url=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Recent form and top-manager ownership
        run: node scripts/build-data.js

      - name: Bookmaker odds (skipped without the ODDS_API_KEY secret)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/build-odds.js

      - name: Model accuracy backtest
        run: node scripts/backtest.js

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh data"
          git push
