# Daily data refresh, free on public repositories.
# Rebuilds data/*.json from the FPL API and commits them only when they change;
# the push redeploys the site on Vercel.
name: Data refresh

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Model accuracy backtest
        run: node scripts/backtest.js

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh data"
          git push
